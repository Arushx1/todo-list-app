<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List Application</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --secondary: #ec4899;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --dark: #1f2937;
            --darker: #111827;
            --light: #f3f4f6;
            --lighter: #e5e7eb;
            --text: #374151;
            --text-light: #6b7280;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.2);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: var(--text);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            animation: slideDown 0.5s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header h1 {
            font-size: 3em;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
            letter-spacing: 0.5px;
        }

        /* Main Card */
        .card {
            background: white;
            border-radius: 15px;
            box-shadow: var(--shadow-lg);
            padding: 30px;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Input Section */
        .input-section {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--lighter);
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .input-wrapper input::placeholder {
            color: var(--text-light);
        }

        .priority-select {
            padding: 12px 15px;
            border: 2px solid var(--lighter);
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .priority-select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .add-btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, var(--primary), #7c3aed);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--shadow);
        }

        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .add-btn:active {
            transform: translateY(0);
        }

        /* Stats Section */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
            padding-bottom: 25px;
            border-bottom: 2px solid var(--light);
        }

        .stat-card {
            background: var(--light);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border-left: 4px solid var(--primary);
        }

        .stat-card.completed {
            border-left-color: var(--success);
        }

        .stat-card.pending {
            border-left-color: var(--warning);
        }

        .stat-card.high {
            border-left-color: var(--danger);
        }

        .stat-number {
            font-size: 1.8em;
            font-weight: 700;
            color: var(--primary);
        }

        .stat-card.completed .stat-number {
            color: var(--success);
        }

        .stat-card.pending .stat-number {
            color: var(--warning);
        }

        .stat-card.high .stat-number {
            color: var(--danger);
        }

        .stat-label {
            font-size: 0.9em;
            color: var(--text-light);
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Filter & Sort Section */
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-btn, .sort-btn, .clear-btn {
            padding: 8px 15px;
            border: 2px solid var(--lighter);
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .filter-btn:hover, .sort-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .clear-btn {
            margin-left: auto;
            border-color: var(--danger);
            color: var(--danger);
        }

        .clear-btn:hover {
            background: var(--danger);
            color: white;
        }

        /* Tasks List */
        .tasks-container {
            max-height: 600px;
            overflow-y: auto;
        }

        .tasks-container::-webkit-scrollbar {
            width: 8px;
        }

        .tasks-container::-webkit-scrollbar-track {
            background: var(--light);
            border-radius: 10px;
        }

        .tasks-container::-webkit-scrollbar-thumb {
            background: var(--lighter);
            border-radius: 10px;
        }

        .tasks-container::-webkit-scrollbar-thumb:hover {
            background: var(--text-light);
        }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-light);
        }

        .empty-icon {
            font-size: 4em;
            margin-bottom: 15px;
        }

        .empty-text {
            font-size: 1.2em;
            margin-bottom: 10px;
        }

        .empty-subtext {
            font-size: 0.95em;
            color: var(--lighter);
        }

        /* Task Item */
        .task-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background: var(--light);
            border-radius: 8px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
            border-left: 4px solid transparent;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .task-item:hover {
            box-shadow: var(--shadow);
            transform: translateX(5px);
        }

        .task-item.completed {
            background: rgba(16, 185, 129, 0.1);
            border-left-color: var(--success);
        }

        .task-item.high-priority {
            border-left-color: var(--danger);
        }

        .task-item.medium-priority {
            border-left-color: var(--warning);
        }

        .task-item.low-priority {
            border-left-color: var(--primary);
        }

        .checkbox {
            width: 24px;
            height: 24px;
            cursor: pointer;
            accent-color: var(--primary);
        }

        .task-content {
            flex: 1;
        }

        .task-text {
            font-size: 1em;
            font-weight: 500;
            margin-bottom: 5px;
            word-break: break-word;
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
            color: var(--text-light);
        }

        .task-meta {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .priority-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.75em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .priority-high {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
        }

        .priority-medium {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
        }

        .priority-low {
            background: rgba(99, 102, 241, 0.2);
            color: var(--primary);
        }

        .task-date {
            font-size: 0.85em;
            color: var(--text-light);
        }

        .task-actions {
            display: flex;
            gap: 8px;
        }

        .task-btn {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            background: white;
            border: 1px solid var(--lighter);
        }

        .task-btn:hover {
            transform: scale(1.1);
        }

        .edit-btn {
            color: var(--primary);
        }

        .edit-btn:hover {
            background: rgba(99, 102, 241, 0.1);
        }

        .delete-btn {
            color: var(--danger);
        }

        .delete-btn:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease-out;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: var(--shadow-lg);
            animation: slideUp 0.3s ease-out;
        }

        .modal-header {
            font-size: 1.5em;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--dark);
        }

        .modal-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-weight: 600;
            color: var(--text);
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            padding: 10px 12px;
            border: 2px solid var(--lighter);
            border-radius: 6px;
            font-size: 1em;
            font-family: inherit;
            resize: vertical;
            min-height: 40px;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .modal-footer {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-footer button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-save {
            background: var(--primary);
            color: white;
        }

        .modal-save:hover {
            background: #5558e3;
        }

        .modal-cancel {
            background: var(--light);
            color: var(--text);
            border: 2px solid var(--lighter);
        }

        .modal-cancel:hover {
            background: var(--lighter);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2em;
            }

            .card {
                padding: 20px;
            }

            .input-section {
                flex-direction: column;
            }

            .priority-select,
            .add-btn {
                width: 100%;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .controls {
                flex-direction: column;
            }

            .filter-btn, .sort-btn, .clear-btn {
                width: 100%;
            }

            .clear-btn {
                margin-left: 0;
                margin-top: 10px;
            }

            .task-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .task-actions {
                width: 100%;
                justify-content: flex-end;
            }

            .modal-content {
                width: 95%;
            }
        }

        /* Print Styles */
        @media print {
            body {
                background: white;
            }

            .header {
                color: black;
            }

            .input-section,
            .controls,
            .task-actions,
            .modal {
                display: none;
            }

            .task-item {
                page-break-inside: avoid;
                border: 1px solid var(--lighter);
                margin-bottom: 15px;
            }
        }

        /* Animations */
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .loading {
            animation: spin 1s linear infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>✓ TO-DO LIST</h1>
            <p>Stay organized and productive</p>
        </div>

        <!-- Main Card -->
        <div class="card">
            <!-- Input Section -->
            <div class="input-section">
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="taskInput" 
                        placeholder="Add a new task..." 
                        autocomplete="off"
                    >
                </div>
                <select id="prioritySelect" class="priority-select">
                    <option value="low">Low Priority</option>
                    <option value="medium" selected>Medium Priority</option>
                    <option value="high">High Priority</option>
                </select>
                <button class="add-btn" onclick="addTask()">Add Task</button>
            </div>

            <!-- Stats Section -->
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-number" id="totalTasks">0</div>
                    <div class="stat-label">Total Tasks</div>
                </div>
                <div class="stat-card completed">
                    <div class="stat-number" id="completedTasks">0</div>
                    <div class="stat-label">Completed</div>
                </div>
                <div class="stat-card pending">
                    <div class="stat-number" id="pendingTasks">0</div>
                    <div class="stat-label">Pending</div>
                </div>
                <div class="stat-card high">
                    <div class="stat-number" id="highPriorityTasks">0</div>
                    <div class="stat-label">High Priority</div>
                </div>
            </div>

            <!-- Controls -->
            <div class="controls">
                <button class="filter-btn active" onclick="filterTasks('all')">All</button>
                <button class="filter-btn" onclick="filterTasks('pending')">Pending</button>
                <button class="filter-btn" onclick="filterTasks('completed')">Completed</button>
                <button class="sort-btn" onclick="sortTasks()">⬍ Sort by Date</button>
                <button class="clear-btn" onclick="clearCompleted()">Clear Completed</button>
            </div>

            <!-- Tasks List -->
            <div class="tasks-container" id="tasksList">
                <div class="empty-state">
                    <div class="empty-icon">📝</div>
                    <div class="empty-text">No tasks yet</div>
                    <div class="empty-subtext">Add a task to get started!</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Task Modal -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">Edit Task</div>
            <div class="modal-form">
                <div class="form-group">
                    <label>Task Title</label>
                    <input type="text" id="editTaskTitle" placeholder="Enter task title">
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="editTaskDescription" placeholder="Enter task description" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>Priority</label>
                    <select id="editTaskPriority">
                        <option value="low">Low Priority</option>
                        <option value="medium">Medium Priority</option>
                        <option value="high">High Priority</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Due Date</label>
                    <input type="date" id="editTaskDueDate">
                </div>
            </div>
            <div class="modal-footer">
                <button class="modal-save" onclick="saveEdit()">Save Changes</button>
                <button class="modal-cancel" onclick="closeEditModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        class TodoApp {
            constructor() {
                this.tasks = this.loadTasks();
                this.currentFilter = 'all';
                this.editingTaskId = null;
                this.init();
            }

            init() {
                this.setupEventListeners();
                this.render();
            }

            setupEventListeners() {
                // Enter key to add task
                document.getElementById('taskInput').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.addTask();
                });

                // Click outside modal to close
                document.getElementById('editModal').addEventListener('click', (e) => {
                    if (e.target.id === 'editModal') this.closeEditModal();
                });
            }

            addTask() {
                const input = document.getElementById('taskInput');
                const priority = document.getElementById('prioritySelect').value;
                const text = input.value.trim();

                if (!text) {
                    alert('Please enter a task');
                    return;
                }

                const task = {
                    id: Date.now(),
                    text,
                    priority,
                    completed: false,
                    createdAt: new Date().toISOString(),
                    dueDate: null,
                    description: ''
                };

                this.tasks.unshift(task);
                this.saveTasks();
                this.render();

                input.value = '';
                input.focus();
            }

            deleteTask(id) {
                if (confirm('Are you sure you want to delete this task?')) {
                    this.tasks = this.tasks.filter(task => task.id !== id);
                    this.saveTasks();
                    this.render();
                }
            }

            toggleTask(id) {
                const task = this.tasks.find(t => t.id === id);
                if (task) {
                    task.completed = !task.completed;
                    this.saveTasks();
                    this.render();
                }
            }

            editTask(id) {
                const task = this.tasks.find(t => t.id === id);
                if (task) {
                    this.editingTaskId = id;
                    document.getElementById('editTaskTitle').value = task.text;
                    document.getElementById('editTaskDescription').value = task.description || '';
                    document.getElementById('editTaskPriority').value = task.priority;
                    document.getElementById('editTaskDueDate').value = task.dueDate || '';
                    document.getElementById('editModal').classList.add('active');
                }
            }

            saveEdit() {
                const task = this.tasks.find(t => t.id === this.editingTaskId);
                if (task) {
                    task.text = document.getElementById('editTaskTitle').value;
                    task.description = document.getElementById('editTaskDescription').value;
                    task.priority = document.getElementById('editTaskPriority').value;
                    task.dueDate = document.getElementById('editTaskDueDate').value;
                    this.saveTasks();
                    this.render();
                    this.closeEditModal();
                }
            }

            closeEditModal() {
                document.getElementById('editModal').classList.remove('active');
                this.editingTaskId = null;
            }

            filterTasks(filter) {
                this.currentFilter = filter;
                
                // Update button states
                document.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.classList.remove('active');
                });
                event.target.classList.add('active');

                this.render();
            }

            sortTasks() {
                this.tasks.sort((a, b) => {
                    if (a.completed === b.completed) {
                        return new Date(b.createdAt) - new Date(a.createdAt);
                    }
                    return a.completed - b.completed;
                });
                this.saveTasks();
                this.render();
            }

            clearCompleted() {
                if (confirm('Delete all completed tasks?')) {
                    this.tasks = this.tasks.filter(task => !task.completed);
                    this.saveTasks();
                    this.render();
                }
            }

            getFilteredTasks() {
                switch (this.currentFilter) {
                    case 'completed':
                        return this.tasks.filter(t => t.completed);
                    case 'pending':
                        return this.tasks.filter(t => !t.completed);
                    default:
                        return this.tasks;
                }
            }

            updateStats() {
                const total = this.tasks.length;
                const completed = this.tasks.filter(t => t.completed).length;
                const pending = total - completed;
                const highPriority = this.tasks.filter(t => t.priority === 'high' && !t.completed).length;

                document.getElementById('totalTasks').textContent = total;
                document.getElementById('completedTasks').textContent = completed;
                document.getElementById('pendingTasks').textContent = pending;
                document.getElementById('highPriorityTasks').textContent = highPriority;
            }

            formatDate(dateString) {
                if (!dateString) return '';
                const date = new Date(dateString);
                return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            }

            render() {
                const filteredTasks = this.getFilteredTasks();
                const tasksList = document.getElementById('tasksList');

                this.updateStats();

                if (filteredTasks.length === 0) {
                    tasksList.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">📝</div>
                            <div class="empty-text">No ${this.currentFilter === 'completed' ? 'completed' : this.currentFilter === 'pending' ? 'pending' : ''} tasks</div>
                            <div class="empty-subtext">${this.currentFilter === 'completed' ? 'Complete some tasks!' : 'Add a task to get started!'}</div>
                        </div>
                    `;
                    return;
                }

                tasksList.innerHTML = filteredTasks.map(task => `
                    <div class="task-item ${task.completed ? 'completed' : ''} ${task.priority}-priority">
                        <input 
                            type="checkbox" 
                            class="checkbox" 
                            ${task.completed ? 'checked' : ''} 
                            onchange="todoApp.toggleTask(${task.id})"
                        >
                        <div class="task-content">
                            <div class="task-text">${this.escapeHtml(task.text)}</div>
                            <div class="task-meta">
                                <span class="priority-badge priority-${task.priority}">${task.priority}</span>
                                ${task.dueDate ? `<span class="task-date">📅 ${this.formatDate(task.dueDate)}</span>` : ''}
                            </div>
                        </div>
                        <div class="task-actions">
                            <button class="task-btn edit-btn" onclick="todoApp.editTask(${task.id})">✏️</button>
                            <button class="task-btn delete-btn" onclick="todoApp.deleteTask(${task.id})">🗑️</button>
                        </div>
                    </div>
                `).join('');
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            saveTasks() {
                localStorage.setItem('todoTasks', JSON.stringify(this.tasks));
            }

            loadTasks() {
                const saved = localStorage.getItem('todoTasks');
                return saved ? JSON.parse(saved) : [];
            }
        }

        // Global instance
        let todoApp;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            todoApp = new TodoApp();
        });

        // Global functions
        function addTask() {
            todoApp.addTask();
        }

        function filterTasks(filter) {
            todoApp.filterTasks(filter);
        }

        function sortTasks() {
            todoApp.sortTasks();
        }

        function clearCompleted() {
            todoApp.clearCompleted();
        }

        function saveEdit() {
            todoApp.saveEdit();
